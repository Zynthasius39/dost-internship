---
- name: "Generate cloud-init for node/{{ node.name }}"
  include_tasks: cloudinit.yml

- name: "Install the VM - node/{{ node.name }}"
  ansible.builtin.command:
    cmd: >
      virt-install 
      --connect {{ uri }}
      --name {{ node.name }}
      --memory {{ node.memory }}
      --vcpus {{ node.vcpu }}
      --noautoconsole
      --wait
      --graphics vnc
      --os-variant name={{ os_name }}
      --disk=size={{ vol_capacity }},backing_store="{{ base_image }}",pool={{ vol_pool }}
      --network network={{ network }},model=virtio,mac={{ node.mac }}
      --cloud-init user-data="{{ ci_file_path }},meta-data={{ md_file_path }},network-config={{ nc_file_path }}"
  args:
    creates: /etc/libvirt/qemu/{{ node.name }}.xml

- name: "Clean up the cloud-init files for node/{{ node.name }}"
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  loop:
    - "{{ ci_file_path }}"
    - "{{ md_file_path }}"
    - "{{ nc_file_path }}"
