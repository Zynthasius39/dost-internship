---
- name: "Install the VM - node/{{ node.name }}"
  community.libvirt.virt_install:
    uri: "{{ uri }}"
    name: "{{ node.name }}"
    memory: "{{ node.memory }}"
    vcpus: "{{ node.vcpu }}"
    autostart: true
    features:
      acpi: true
      apic:
        eoi: on
      vmport:
        state: off
    clock:
      offset: utc
      timers:
        - name: rtc
          present: yes
          tickpolicy: catchup
        - name: pit
          present: yes
          tickpolicy: delay
        - name: hpet
          present: no
    osinfo:
      name: debian13
    graphics:
      # Spice is not supported for
      # qemu-kvm-9.1.0-29.el9_7.6.alma.1
      type: vnc
    disks:
      - backing_store: "{{ base_image }}"
        pool: "{{ vol_pool }}"
        size: "{{ vol_capacity }}"
    networks:
      - model:
          type: virtio
        network: "{{ network }}"
        mac:
          address: "{{ node.mac }}"
    cloud_init:
      user_data: |
        #cloud-config
        hostname: {{ node.name }}
        create_hostname_file: true

        allow_public_ssh_keys: true
        disable_root: true
        disable_root_opts: no-port-forwarding,no-agent-forwarding,no-X11-forwarding
        package_update: true
        packages:
          - ansible
        ssh_deletekeys: true
        ssh_genkeytypes:
          - rsa
          - ecdsa
          - ed25519
        ssh_publish_hostkeys:
          blacklist:
            - rsa
          enabled: true
        ssh_quiet_keygen: true

        users:
          - name: default
            sudo: ALL=(ALL) NOPASSWD:ALL
            ssh_authorized_keys: ["{{ ssh_keygen.public_key }}"]
      meta_data: |
        instance-id: {{ node.name }}
        local-hostname: {{ node.name }}
      network_config: |
        network:
          version: 2
          ethernets:
            eth0:
              match:
                macaddress: {{ node.mac }}
              dhcp4: false
              addresses: ["{{ node.ip }}{{ node_subnet_prefix }}"]
              gateway4: {{ gateway }}
              nameservers:
                search: {{ nameservers.search | to_json }}
                addresses: {{ nameservers.addresses | to_json }}
