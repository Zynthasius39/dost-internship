all:
  hosts:
    k8s-eclair-1:
      ansible_host: 10.0.16.11

    k8s-eclair-2:
      ansible_host: 10.0.16.12

    k8s-eclair-3:
      ansible_host: 10.0.16.13

  children:
    kube_control_plane:
      hosts:
        k8s-eclair-1:

    kube_node:
      hosts:
        k8s-eclair-2:
        k8s-eclair-3:

    etcd:
      children:
        kube_control_plane:

    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:

  vars:
    ansible_user: debian
    ansible_python_interpreter: /usr/bin/python3.13
    ansible_ssh_private_key_file: "{{ 'keys/k8s-eclair' | realpath }}"
    ip: "{{ ansible_host }}"
    node_subnet: 10.0.16.0/20
