all:
  hosts:
    k8s-eclair-1:
      ansible_host: 192.168.122.11
      ip: 192.168.122.11

    k8s-eclair-2:
      ansible_host: 192.168.122.12
      ip: 192.168.122.12

    k8s-eclair-3:
      ansible_host: 192.168.122.13
      ip: 192.168.122.13

  children:
    kube_control_plane:
      hosts:
        k8s-eclair-1:

    kube_node:
      hosts:
        k8s-eclair-2:
        k8s-eclair-3:

    etcd:
      hosts:
        k8s-eclair-1:

    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:

  vars:
    ansible_user: debian
    ansible_python_interpreter: /usr/bin/python3.13
    ansible_ssh_private_key_file: "{{ 'keys/k8s-eclair' | realpath }}"
    node_subnet_prefix: /24
    node_network: "192.168.122.0{{ node_subnet_prefix }}"
